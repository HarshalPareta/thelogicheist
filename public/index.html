<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Logic Heist - Join</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/jpeg" href="/images/heist-logo.jpg">
</head>
<body>
<div class="wave-wrap top">
  <svg class="wave-svg horizontal" viewBox="0 0 2000 80" preserveAspectRatio="none">
    <path d="M0,40 Q100,80 200,40 T400,40 T600,40 T800,40 T1000,40 T1200,40 T1400,40 T1600,40 T1800,40 T2000,40" class="wave-path"/>
  </svg>
</div>
<div class="wave-wrap bottom">
  <svg class="wave-svg horizontal" viewBox="0 0 2000 80" preserveAspectRatio="none">
    <path d="M0,40 Q100,0 200,40 T400,40 T600,40 T800,40 T1000,40 T1200,40 T1400,40 T1600,40 T1800,40 T2000,40" class="wave-path"/>
  </svg>
</div>
<div class="wave-wrap left">
  <svg class="wave-svg vertical" viewBox="0 0 80 2000" preserveAspectRatio="none">
    <path d="M40,0 Q80,100 40,200 T40,400 T40,600 T40,800 T40,1000 T40,1200 T40,1400 T40,1600 T40,1800 T40,2000" class="wave-path"/>
  </svg>
</div>
<div class="wave-wrap right">
  <svg class="wave-svg vertical" viewBox="0 0 80 2000" preserveAspectRatio="none">
    <path d="M40,0 Q0,100 40,200 T40,400 T40,600 T40,800 T40,1000 T40,1200 T40,1400 T40,1600 T40,1800 T40,2000" class="wave-path"/>
  </svg>
</div>
<div class="bg-dot red" style="top:10%;left:10%;animation-delay:0s;"></div>
<div class="bg-dot white" style="top:20%;right:15%;animation-delay:1s;"></div>
<div class="bg-dot red" style="bottom:30%;left:20%;animation-delay:2s;"></div>
<div class="bg-dot white" style="top:60%;right:30%;animation-delay:0.5s;"></div>
<div class="bg-dot red" style="bottom:15%;right:10%;animation-delay:1.5s;"></div>
<div class="bg-dot white" style="top:10%;right:60%;animation-delay:2.5s;"></div>
<div class="bg-dot red" style="bottom:40%;right:40%;animation-delay:3s;"></div>
<div class="bg-dot white" style="top:80%;left:70%;animation-delay:0.8s;"></div>
<div class="bg-dot red" style="top:40%;left:80%;animation-delay:1.8s;"></div>
<div class="bg-dot white" style="bottom:10%;left:50%;animation-delay:2.2s;"></div>
<div class="note-drop h" style="left:8%;animation-delay:0s;"><div class="sign">$</div></div>
<div class="note-drop v" style="left:22%;animation-delay:1.5s;"><div class="sign">$</div></div>
<div class="note-drop h" style="left:38%;animation-delay:3s;"><div class="sign">$</div></div>
<div class="note-drop v" style="left:52%;animation-delay:0.5s;"><div class="sign">$</div></div>
<div class="note-drop h" style="left:66%;animation-delay:4.5s;"><div class="sign">$</div></div>
<div class="note-drop v" style="left:80%;animation-delay:2s;"><div class="sign">$</div></div>
<div class="note-drop h" style="left:92%;animation-delay:5.5s;"><div class="sign">$</div></div>
<div class="note-drop v" style="left:45%;animation-delay:7s;"><div class="sign">$</div></div>
<header>
  <img id="daliMask" src="/images/heist-logo.jpg" alt="Admin access" title="Admin">
  <div class="brand">
    <h1>The Logic Heist</h1>
    <div class="tagline">Bella ciao, bella ciao.</div>
  </div>
  <div class="music-control">
    <div class="music-bars" id="musicBars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <input class="music-volume" id="musicVolume" type="range" min="0" max="100" value="30" aria-label="Background music volume">
    <button class="music-btn" id="musicBtn" type="button" aria-pressed="false">Music off</button>
  </div>
</header>

<div id="landing" class="screen active">
  <div class="slogan">
    <div class="note">We are not robbers.<br>We are <span class="hot">resistance</span>.</div>
  </div>
  <div class="card">
    <h2 class="note">Join the heist</h2>
    <p class="sub">Enter your team name and the location where you begin.</p>
    <label>Team Name</label>
    <input type="text" id="teamName" placeholder="e.g. Phantom Crew" maxlength="30">
    <label>Starting Location</label>
    <select id="startStation">
      <option value="1">The Professor’s Blackboard</option>
      <option value="2">The Royal Mint Blueprint</option>
      <option value="3">The Rio Firewall</option>
      <option value="4">Inspector Murillo’s Tent</option>
      <option value="5">The Submerged Vault</option>
    </select>
    <button class="btn" id="joinBtn">Enter The Heist</button>
    <div style="margin-top:14px; font-size:0.85rem; color:var(--muted);">
      12 min puzzle limit per station &bull; 2 min transition after stop
    </div>
  </div>
</div>

<!-- Password modal (unlock admin on this device) -->
<div class="modal-overlay hidden" id="passModal">
  <div class="modal">
    <h3>Admin Access</h3>
    <p>Enter the station master password</p>
    <input type="password" id="passInput" placeholder="Password">
    <div class="btn-row">
      <button class="btn secondary" id="passCancel">Cancel</button>
      <button class="btn" id="passSubmit">Unlock</button>
    </div>
    <div id="passErr"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/station-names.js"></script>
<script src="/js/heist-music.js"></script>
<script>
  const CLICKS_REQUIRED = 5;
  const CLICK_WINDOW_MS = 3000;
  const ADMIN_PASSWORD = 'Harshal@148';

  let clickCount = 0;
  let clickTimer = null;
  const mask = document.getElementById('daliMask');
  const socket = io();

  mask.addEventListener('click', () => {
    clickCount++;
    mask.classList.add('hint');
    if (clickTimer) clearTimeout(clickTimer);
    if (clickCount >= CLICKS_REQUIRED) {
      clickCount = 0;
      if (clickTimer) clearTimeout(clickTimer);
      openPasswordModal();
    } else {
      clickTimer = setTimeout(() => {
        clickCount = 0;
        mask.classList.remove('hint');
      }, CLICK_WINDOW_MS);
    }
  });

  const passModal = document.getElementById('passModal');
  const passInput = document.getElementById('passInput');
  const passErr = document.getElementById('passErr');
  const passSubmit = document.getElementById('passSubmit');
  const passCancel = document.getElementById('passCancel');

  function openPasswordModal() {
    passModal.classList.remove('hidden');
    passInput.value = '';
    passErr.textContent = '';
    passInput.focus();
  }
  function closePasswordModal() {
    passModal.classList.add('hidden');
  }
  function tryPassword() {
    socket.emit('admin:auth', { password: passInput.value });
  }
  socket.on('admin:authed', (ok) => {
    if (ok) {
      closePasswordModal();
      window.location.href = '/admin';
    } else {
      passErr.textContent = 'Incorrect password.';
      passInput.value = '';
      passInput.focus();
    }
  });
  passSubmit.addEventListener('click', tryPassword);
  passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryPassword(); });
  passCancel.addEventListener('click', closePasswordModal);

  // Team join
  document.getElementById('joinBtn').addEventListener('click', () => {
    const name = document.getElementById('teamName').value.trim();
    const station = document.getElementById('startStation').value;
    if (!name) { alert('Please enter a team name.'); return; }
    socket.emit('team:join', { name, startStation: station });
    localStorage.setItem('lh_team', name);
    localStorage.setItem('lh_station', station);
    window.location.href = '/team';
  });
</script>
</body>
</html>
