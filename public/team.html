<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Logic Heist - Team Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/jpeg" href="/images/heist-logo.jpg">
</head>
<body>
<div class="wave-wrap top">
  <svg class="wave-svg horizontal" viewBox="0 0 2000 80" preserveAspectRatio="none">
    <path d="M0,40 Q100,80 200,40 T400,40 T600,40 T800,40 T1000,40 T1200,40 T1400,40 T1600,40 T1800,40 T2000,40" class="wave-path"/>
  </svg>
</div>
<div class="wave-wrap bottom">
  <svg class="wave-svg horizontal" viewBox="0 0 2000 80" preserveAspectRatio="none">
    <path d="M0,40 Q100,0 200,40 T400,40 T600,40 T800,40 T1000,40 T1200,40 T1400,40 T1600,40 T1800,40 T2000,40" class="wave-path"/>
  </svg>
</div>
<div class="wave-wrap left">
  <svg class="wave-svg vertical" viewBox="0 0 80 2000" preserveAspectRatio="none">
    <path d="M40,0 Q80,100 40,200 T40,400 T40,600 T40,800 T40,1000 T40,1200 T40,1400 T40,1600 T40,1800 T40,2000" class="wave-path"/>
  </svg>
</div>
<div class="wave-wrap right">
  <svg class="wave-svg vertical" viewBox="0 0 80 2000" preserveAspectRatio="none">
    <path d="M40,0 Q0,100 40,200 T40,400 T40,600 T40,800 T40,1000 T40,1200 T40,1400 T40,1600 T40,1800 T40,2000" class="wave-path"/>
  </svg>
</div>
<div class="bg-dot red" style="top:10%;left:10%;animation-delay:0s;"></div>
<div class="bg-dot white" style="top:20%;right:15%;animation-delay:1s;"></div>
<div class="bg-dot red" style="bottom:30%;left:20%;animation-delay:2s;"></div>
<div class="bg-dot white" style="top:60%;right:30%;animation-delay:0.5s;"></div>
<div class="bg-dot red" style="bottom:15%;right:10%;animation-delay:1.5s;"></div>
<div class="bg-dot white" style="top:10%;right:60%;animation-delay:2.5s;"></div>
<div class="bg-dot red" style="bottom:40%;right:40%;animation-delay:3s;"></div>
<div class="bg-dot white" style="top:80%;left:70%;animation-delay:0.8s;"></div>
<div class="bg-dot red" style="top:40%;left:80%;animation-delay:1.8s;"></div>
<div class="bg-dot white" style="bottom:10%;left:50%;animation-delay:2.2s;"></div>
<div class="note-drop h" style="left:8%;animation-delay:0s;"><div class="sign">$</div></div>
<div class="note-drop v" style="left:22%;animation-delay:1.5s;"><div class="sign">$</div></div>
<div class="note-drop h" style="left:38%;animation-delay:3s;"><div class="sign">$</div></div>
<div class="note-drop v" style="left:52%;animation-delay:0.5s;"><div class="sign">$</div></div>
<div class="note-drop h" style="left:66%;animation-delay:4.5s;"><div class="sign">$</div></div>
<div class="note-drop v" style="left:80%;animation-delay:2s;"><div class="sign">$</div></div>
<div class="note-drop h" style="left:92%;animation-delay:5.5s;"><div class="sign">$</div></div>
<div class="note-drop v" style="left:45%;animation-delay:7s;"><div class="sign">$</div></div>

<header>
  <img class="brand-logo" src="/images/heist-logo.jpg" alt="The Logic Heist logo">
  <div class="brand">
    <h1>The Logic Heist</h1>
    <div class="tagline">Bella ciao, bella ciao.</div>
  </div>
  <div class="music-control">
    <div class="music-bars" id="musicBars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <input class="music-volume" id="musicVolume" type="range" min="0" max="100" value="30" aria-label="Background music volume">
    <button class="music-btn" id="musicBtn" type="button" aria-pressed="false">Music off</button>
  </div>
  <button class="btn secondary leave-btn" id="leaveBtn">Leave / Change Team</button>
</header>

<div id="teamView" class="screen active">
  <div class="card">
    <h2 class="note mission-location" id="curStationLabel">The Professor’s Blackboard</h2>

    <!-- Timer views -->
    <div id="timerArea" style="display:none;">
      <div class="timer-big" id="timerDisplay">12:00</div>
      <div class="timer-label" id="timerLabel">Time Remaining</div>
    </div>
    <div class="status-text" id="statusText" style="display:none;"></div>

    <!-- Start station timer -->
    <button class="btn" id="startStationBtn">Start Station Timer</button>

    <!-- Station selection -->
    <div id="stationSelectArea" style="display:none; margin-top:18px;">
      <label style="display:block; margin-bottom:8px; font-weight:600; color:var(--text); text-align:left;">Select your next assigned location</label>
      <select id="nextStationSelect"></select>
      <button class="btn" id="confirmStationBtn">Select Location</button>
    </div>

    <div style="margin-top:14px; font-size:0.85rem; color:var(--muted);">
      Team: <span id="teamNameLabel">-</span> &bull; Completed locations: <span id="completedLabel">none</span>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/station-names.js"></script>
<script src="/js/heist-music.js"></script>
<script>
  const STATION_COUNT = 5;
  const STATION_LIMIT_MS = 12 * 60 * 1000;
  const TRANSITION_LIMIT_MS = 2 * 60 * 1000;

  let myName = localStorage.getItem('lh_team') || '';
  let teams = {};
  let socket = io();

  const curStationLabel = document.getElementById('curStationLabel');
  const timerArea = document.getElementById('timerArea');
  const timerDisplay = document.getElementById('timerDisplay');
  const timerLabel = document.getElementById('timerLabel');
  const statusText = document.getElementById('statusText');
  const startStationBtn = document.getElementById('startStationBtn');
  const stationSelectArea = document.getElementById('stationSelectArea');
  const nextStationSelect = document.getElementById('nextStationSelect');
  const confirmStationBtn = document.getElementById('confirmStationBtn');
  const teamNameLabel = document.getElementById('teamNameLabel');
  const completedLabel = document.getElementById('completedLabel');

  teamNameLabel.textContent = myName;

  function fmt(ms) {
    if (ms == null || ms < 0) return '--:--';
    const totalSec = Math.max(0, Math.floor(ms / 1000));
    const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
    const s = (totalSec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }
  function stationKey(n) { return 's' + n; }

  function populateStationSelect(team) {
    nextStationSelect.innerHTML = '';
    const avail = [...Array(STATION_COUNT).keys()].map(i => i + 1).filter(s => {
      if (team.completedStations.includes(s)) return false;
      const d = team.stationTimes[stationKey(s)];
      if (d && d.start != null) return false;
      return true;
    });
    avail.forEach(s => {
      const o = document.createElement('option');
      o.value = s;
      o.textContent = stationName(s);
      nextStationSelect.appendChild(o);
    });
  }

  let lastStatus = null;

  function render() {
    const team = teams[myName];
    if (!team) return;

    curStationLabel.textContent = stationName(team.currentStation);
    completedLabel.textContent = team.completedStations.length
      ? team.completedStations.map(stationName).join(', ')
      : 'none';

    timerArea.style.display = 'none';
    startStationBtn.style.display = 'none';
    statusText.style.display = 'none';
    stationSelectArea.style.display = 'none';

    if (team.status === 'idle') {
      startStationBtn.style.display = 'block';
      startStationBtn.textContent = 'Start Location Timer';
      startStationBtn.disabled = false;
    } else if (team.status === 'active') {
      timerArea.style.display = 'block';
      statusText.style.display = 'none';
      timerLabel.textContent = 'Time Remaining';
      const remaining = STATION_LIMIT_MS - (Date.now() - (team.stationTimerStart || Date.now()));
      timerDisplay.textContent = remaining <= 0 ? '00:00' : fmt(remaining);
    } else if (team.status === 'paused') {
      timerArea.style.display = 'block';
      statusText.style.display = 'block';
      statusText.textContent = 'Paused — Admin will resume';
      statusText.className = 'status-text wait';
      timerLabel.textContent = 'Time Remaining';
      const cs = team.currentStation;
      const pausedElapsed = (team.stationTimes[stationKey(cs)] && team.stationTimes[stationKey(cs)].pausedElapsed) || 0;
      const remaining = STATION_LIMIT_MS - pausedElapsed;
      timerDisplay.textContent = remaining <= 0 ? '00:00' : fmt(remaining);
    } else if (team.status === 'transition') {
      timerArea.style.display = 'block';
      statusText.style.display = 'none';
      timerLabel.textContent = 'Transition window';
      const remaining = TRANSITION_LIMIT_MS - (Date.now() - (team.transitionStart || Date.now()));
      timerDisplay.textContent = remaining <= 0 ? '00:00' : fmt(remaining);
    } else if (team.status === 'station_select') {
      stationSelectArea.style.display = 'block';
      if (lastStatus !== 'station_select') {
        populateStationSelect(team);
      }
    } else if (team.status === 'finished') {
      statusText.style.display = 'block';
      statusText.textContent = 'All stations complete — Heist finished!';
      statusText.className = 'status-text';
    }

    lastStatus = team.status;
  }

  socket.on('state:init', (t) => { teams = t; render(); });
  socket.on('state:update', (t) => { teams = t; render(); });

  socket.on('connect', () => {
    socket.emit('team:identify', { name: myName });
  });

  socket.on('reconnect', () => {
    socket.emit('team:identify', { name: myName });
  });

  startStationBtn.addEventListener('click', () => {
    socket.emit('team:start', { name: myName });
  });

  confirmStationBtn.addEventListener('click', () => {
    socket.emit('team:select_station', { name: myName, station: nextStationSelect.value });
  });

  document.getElementById('leaveBtn').addEventListener('click', () => {
    localStorage.removeItem('lh_team');
    localStorage.removeItem('lh_station');
    window.location.href = '/';
  });

  setInterval(render, 1000);
</script>
</body>
</html>
